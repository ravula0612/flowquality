name: Tests
on: [push, pull_request]
jobs:
  spark35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[dev]' pyspark==3.5.3
      - run: pytest -q
      - run: python -m build
